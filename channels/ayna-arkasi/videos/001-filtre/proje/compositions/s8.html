          tl.set(el, { opacity: 1 }, at);
          tl.fromTo(el, { y: heavy ? (dy || 80) : 46 }, { y: 0, duration: heavy ? 0.2 : 0.15, ease: "power4.out", immediateRender: false }, at);
          at += gap; gap *= 0.84; }); };

          tl.to(out, { opacity: 0.15, duration: 0.2, ease: "none" }, t - 0.2);
