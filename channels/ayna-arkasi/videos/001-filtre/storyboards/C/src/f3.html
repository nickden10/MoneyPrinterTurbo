<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>C · f3 yumuşatma ve esnetme</title>
<link rel="stylesheet" href="common.css"><script src="face.js"></script>
<style>
html,body,.frame{background:var(--toz-pembe-acik)}
.title{position:absolute;left:60px;top:246px;width:880px;font:700 60px/1.18 "Be Vietnam Pro";color:var(--plum)}
.title em{font-style:normal;color:var(--berry)}
.stage{position:absolute;left:60px;top:420px;width:880px;height:570px;border-radius:36px;overflow:hidden;box-shadow:0 0 0 4px var(--plum)}
.lab{position:absolute;top:1004px;font:700 30px "Be Vietnam Pro";color:var(--berry)}
.light .src{font-size:29px;line-height:1.3}
.cap{-webkit-text-stroke:0;gap:0}
.cap .pill{background:rgba(28,20,36,.92);padding:6px 34px 12px;border-radius:28px;line-height:1.14}
.ring{position:absolute;inset:-60px;border:2px solid rgba(142,59,90,.18);border-radius:80px}
</style></head><body><div class="frame light">
<div class="crumbs">telefon<i>›</i>piksel<i>›</i>nokta<i>›</i><b>yumuşatma</b><i>›</i>esnetme<i>›</i>geri</div>
<div class="title">Yumuşatma <em>dokuyu</em> süpürür,<br>sonra görüntü esner.</div>
<div class="stage" id="st"></div>
<div class="lab" style="left:60px">← doku silindi</div>
<div class="lab" style="left:560px;width:380px;text-align:right">doku henüz duruyor →</div>
<div class="src" style="top:1052px">Yumuşatma · Kaynak: Tomasi &amp; Manduchi 1998<br>Esnetme (warp) · Kaynak: Schaefer vd. 2006; US 10152778</div>
<div class="strip" id="strip"></div>
<script>(function(n){let h="";for(let i=0;i<30;i++)h+="<i"+(i<=n&&i>=n?" class=\"cur\"":"")+"></i>";document.getElementById("strip").innerHTML=h})(17)</script>
<div class="cap"><div class="pill">ince tüyler,<br>hepsi <span class="on">silinir.</span></div></div>
</div>
<script>
const BX=166; // pencerenin geçtiği sınır (yüz koordinatı)
const defs=`<clipPath id="ahead"><rect x="${BX}" y="0" width="400" height="500"/></clipPath>`;
// esnetme ızgarası: göz çevresinde dışa doğru şişer (nötr renk)
const C=[159,229],R=46,K=0.28;
function warp(x,y){const dx=x-C[0],dy=y-C[1],r=Math.hypot(dx,dy);if(r>=R)return[x,y];const f=1+K*(1-(r/R)**2)**2;return[C[0]+dx*f,C[1]+dy*f]}
let g='';const x0=70,x1=280,y0=180,y1=330,st=8;
for(let x=x0;x<=x1;x+=st){let d='';for(let y=y0;y<=y1;y+=2){const[p,q]=warp(x,y);d+=(d?'L':'M')+p.toFixed(2)+' '+q.toFixed(2)}g+=`<path d="${d}"/>`}
for(let y=y0;y<=y1;y+=st){let d='';for(let x=x0;x<=x1;x+=2){const[p,q]=warp(x,y);d+=(d?'L':'M')+p.toFixed(2)+' '+q.toFixed(2)}g+=`<path d="${d}"/>`}
const grid=`<g fill="none" stroke="#1C1424" stroke-opacity=".28" stroke-width=".35">${g}</g>`;
const ghost=`<path d="${FACE_PATHS.eyeL}" transform="translate(${C[0]} ${C[1]}) scale(1.22) translate(${-C[0]} ${-C[1]})" fill="none" stroke="#A89BB0" stroke-width=".8" stroke-dasharray="2 1.6"/>`;
const arrows=[[0,-1],[-1,0],[1,0],[0,1]].map(([a,b])=>{const sx=C[0]+a*30,sy=C[1]+b*17,ex=C[0]+a*38,ey=C[1]+b*23;return `<path d="M${sx} ${sy} L${ex} ${ey}" stroke="#A89BB0" stroke-width="1" marker-end="url(#ah)"/>`}).join('');
const mark=`<marker id="ah" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#A89BB0"/></marker>`;
// yumuşatma penceresi + iz
const win=`<rect x="${BX-16}" y="264" width="32" height="32" rx="5" fill="rgba(246,225,227,.10)" stroke="#1C1424" stroke-width="1.1" stroke-dasharray="3 2"/>
 <path d="M96 281 L${BX-20} 281" stroke="#F6E1E3" stroke-opacity=".55" stroke-width="1" stroke-dasharray="1.5 2.5"/>
 <circle cx="${BX}" cy="280" r="5.5" fill="none" stroke="#E8B4B8" stroke-opacity=".5" stroke-width="2.5"/><circle cx="${BX}" cy="280" r="3" fill="#E8B4B8"/>
 <rect x="${BX-16}" y="252" width="40" height="9" rx="2" fill="#1C1424"/><text x="${BX-13}" y="258.6" font-family="Be Vietnam Pro" font-weight="700" font-size="5.6" fill="#F6E1E3">yumuşatma</text>`;
document.getElementById('st').innerHTML=faceSVG({w:880,h:570,viewBox:'80 194 176 114',lineW:2.4,bg:'#2A2033',defs:defs+mark,textureClip:'url(#ahead)',extra:grid+ghost+arrows+win});
</script></body></html>
